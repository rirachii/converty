name: Converty
options:
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
packages:
  ConvertyNative:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Converty:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        excludes: [bin, AppIcon.icns]
        buildPhase: resources
      - path: Artwork/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: ConvertyNative
        product: ConvertyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myko.converty
        PRODUCT_NAME: Converty
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Converty:
    build:
      targets:
        Converty: all
    run:
      config: Debug
